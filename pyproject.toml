[project]
name = "django-lookups-i18n"
version = "0.1.0"
description = "Multi-lingual lookups for Django."
readme = "README.md"
authors = [
    { name = "Dan Watson", email = "dcwatson@gmail.com" }
]
requires-python = ">=3.11"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django>=5.2",
]

[tool.uv.build-backend]
module-name = "django_lookups"
